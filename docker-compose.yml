services:

  devops-platform:
    image: ${IMAGE_NAME}:${IMAGE_VERSION}
    container_name: devops-platform
    restart: unless-stopped

    networks:
      - devops-network


  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped

    ports:
      - "${PROXY_PORT}:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - devops-platform

    networks:
      - devops-network


networks:
  devops-network:
