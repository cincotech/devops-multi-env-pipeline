name: CD Pipeline

on:
  workflow_run:
    workflows: 
      - CI Pipeline
    types:
      - completed

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    # S'exécute uniquement si la CI a réussi ET que la branche modifiée était 'develop'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    steps:
       # <-- Ajouter cette étape ici
      - name: Debug SSH configuration
        run: |
          echo "Host: ${{ secrets.VM_HOST_DEV }}"
          echo "User: ${{ secrets.VM_USER }}"
          echo "Port length: ${#PORT}"
        env:
          PORT: ${{ secrets.VM_PORT_DEV }}

      - name: Déploiement applicatif distant sur VP-DEV via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2224

          script: |
            mkdir -p /opt/devops-platform
            cd /opt/devops-platform
            
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Récupération de l'image taguée develop
            docker pull ghcr.io/${{ github.repository }}:latest-develop
            
            # Injection dynamique de l'image de dev pour Docker Compose
            IMAGE_VERSION=latest-develop docker compose up -d --remove-orphans
            
            docker image prune -f

  deploy-prod:
    runs-on: ubuntu-latest
    # S'exécute uniquement si la CI a réussi ET que la branche modifiée était 'main'
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Déploiement applicatif distant sur VP-PROD via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2223

          script: |
            mkdir -p /opt/devops-platform
            cd /opt/devops-platform
            
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Récupération de l'image taguée main (prod)
            docker pull ghcr.io/${{ github.repository }}:latest-main
            
            # Injection dynamique de l'image de prod pour Docker Compose
            IMAGE_VERSION=latest-main docker compose up -d --remove-orphans
            
            docker image prune -f
